[phases.setup]

nixPkgs = ['php82', 'php82Extensions.pdo_mysql', 'php82Extensions.mbstring', 'php82Extensions.xml', 'php82Extensions.curl', 'php82Extensions.zip', 'php82Extensions.bcmath', 'php82Extensions.gd', 'php82Extensions.intl', 'php82Extensions.opcache', 'nodejs_18']

[phases.install]

cmds = [
    'mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache',
    'chmod -R 775 storage bootstrap/cache || true',
    'composer install --no-dev --optimize-autoloader'
]

[phases.build]

cmds = [
    'npm ci',
    'npm run build',
    'php artisan config:cache || true',
    'php artisan route:cache || true',
    'php artisan view:cache || true'
]

[start]

cmd = 'php artisan serve --host 0.0.0.0 --port ${PORT:-3000}'
